<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Digital Shop 🍓 by hi.littlenami</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #F8EBD8;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #3f3937;
    }
    .font-brand {
      font-family: 'Fredoka', cursive, sans-serif;
    }
    .retro-shadow {
      box-shadow: 3px 3px 0px rgba(217, 87, 79, 0.25);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Bar -->
  <header class="bg-[#E9899F] text-white text-xs font-semibold py-1.5 px-4 text-center flex items-center justify-center gap-2">
    <span>🍓</span>
    <span>Terpercaya Sejak 2022 • Koleksi produk digital favoritmu di Little Digital Shop! ୨ৎ</span>
  </header>

  <!-- Navbar -->
  <nav class="sticky top-0 bg-[#F8EBD8]/95 backdrop-blur-md border-b-2 border-[#E9899F]/30 z-20 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 cursor-pointer" onclick="showStoreView()">
        <div class="w-10 h-10 rounded-2xl bg-[#D9574F] text-white flex items-center justify-center text-xl font-brand border-2 border-white">
          🍓
        </div>
        <div>
          <h1 class="font-brand text-lg text-[#D9574F] font-bold leading-tight">Little Digital Shop</h1>
          <p class="text-[11px] text-[#8FA477] font-semibold leading-none">by hi.littlenami</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="admin-switch-btn" type="button" onclick="handleAdminClick()" class="text-xs font-bold px-3 py-2 rounded-xl border-2 border-[#8FA477] text-[#4d5e3c] bg-white active:scale-95 transition">
          Mode Admin
        </button>

        <button id="cart-btn" type="button" onclick="openCart()" class="relative p-2.5 rounded-xl bg-[#D9574F] text-white active:scale-95 transition">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i>
          <span id="cart-badge" class="hidden absolute -top-1.5 -right-1.5 bg-[#EFC653] text-[#714f08] font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow max-w-5xl w-full mx-auto p-4 pb-20">
    
    <!-- 1. TOKO / STOREFRONT -->
    <div id="store-section" class="space-y-5">
      <!-- Search -->
      <div class="relative">
        <input 
          type="text" 
          id="search-box" 
          oninput="renderProductCards()" 
          placeholder="Cari aplikasi premium, e-book, atau paket..." 
          class="w-full pl-4 pr-4 py-2.5 rounded-2xl bg-white border-2 border-[#E9899F]/40 focus:outline-none text-sm"
        />
      </div>

      <!-- Categories -->
      <div id="category-chips" class="flex gap-2 overflow-x-auto no-scrollbar py-1"></div>

      <!-- Product Grid -->
      <div id="product-list" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4"></div>
    </div>

    <!-- 2. ADMIN DASHBOARD -->
    <div id="admin-section" class="hidden space-y-5">
      <div class="flex items-center justify-between bg-white p-4 rounded-3xl border-2 border-[#8FA477]/40">
        <div>
          <h2 class="font-brand text-lg text-[#4d5e3c]">Dashboard Pengelola</h2>
          <p class="text-xs text-stone-500">Kelola katalog produk tokomu langsung.</p>
        </div>
        <div class="flex gap-2">
          <button type="button" onclick="showStoreView()" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-stone-100 text-stone-600 border">Keluar</button>
          <button type="button" onclick="openImportPopup()" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-[#EFC653] text-[#714f08]">Import JSON</button>
          <button type="button" onclick="openNewProductPopup()" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-[#D9574F] text-white">+ Produk</button>
        </div>
      </div>

      <!-- Admin Product List -->
      <div class="bg-white rounded-3xl border-2 border-[#E9899F]/30 p-4 overflow-x-auto">
        <table class="w-full text-xs text-left">
          <thead class="bg-[#F8EBD8] text-[#D9574F] font-brand">
            <tr>
              <th class="p-2.5">Produk</th>
              <th class="p-2.5">Kategori</th>
              <th class="p-2.5">Variasi</th>
              <th class="p-2.5 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="admin-table-body" class="divide-y divide-stone-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Detail Product Modal -->
  <div id="detail-modal" class="fixed inset-0 z-50 bg-black/40 flex items-end md:items-center justify-center p-0 md:p-4 hidden">
    <div class="bg-white w-full max-w-lg rounded-t-3xl md:rounded-3xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-start">
        <h3 id="modal-title" class="font-brand text-lg text-[#D9574F] font-bold"></h3>
        <button type="button" onclick="closeDetailModal()" class="text-stone-400 font-bold p-1">✕</button>
      </div>
      <p id="modal-desc" class="text-xs text-stone-600"></p>
      <div id="modal-packages" class="space-y-2"></div>
      <button type="button" onclick="addSelectedToCart()" class="w-full py-3 rounded-2xl bg-[#D9574F] text-white font-brand font-bold text-sm">
        Tambah ke Keranjang 🍓
      </button>
    </div>
  </div>

  <!-- Cart Drawer -->
  <div id="cart-modal" class="fixed inset-0 z-50 bg-black/40 flex justify-end hidden">
    <div class="bg-white w-full max-w-md h-full flex flex-col p-5">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-brand text-lg text-[#D9574F]">Keranjang Belanja 🍓</h3>
        <button type="button" onclick="closeCart()" class="font-bold text-stone-400 p-1">✕</button>
      </div>
      <div id="cart-list" class="flex-grow overflow-y-auto py-3 space-y-2"></div>
      <div class="border-t pt-3 space-y-2">
        <input type="text" id="cust-name" placeholder="Nama Kamu *" class="w-full text-xs p-2.5 rounded-xl border" />
        <input type="tel" id="cust-wa" placeholder="Nomor WhatsApp *" class="w-full text-xs p-2.5 rounded-xl border" />
        <div class="flex justify-between font-bold text-sm pt-2">
          <span>Total</span>
          <span id="cart-total-text" class="text-[#D9574F]">Rp 0</span>
        </div>
        <button type="button" onclick="sendOrderWhatsApp()" class="w-full py-3 rounded-2xl bg-[#8FA477] text-white font-brand font-bold text-sm">
          Kirim Pesanan ke WhatsApp 🍓
        </button>
      </div>
    </div>
  </div>

  <!-- Import Popup -->
  <div id="import-popup" class="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 space-y-3">
      <h3 class="font-brand text-base text-[#b38612]">Import Data Produk (JSON)</h3>
      <textarea id="import-input" rows="7" placeholder="Paste kode JSON produk di sini..." class="w-full p-2.5 text-xs font-mono border rounded-xl"></textarea>
      <div class="flex gap-2">
        <button type="button" onclick="closeImportPopup()" class="flex-1 py-2 rounded-xl border text-xs font-bold">Batal</button>
        <button type="button" onclick="executeImport()" class="flex-1 py-2 rounded-xl bg-[#EFC653] text-[#714f08] font-bold text-xs">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nypsejsidrazsvknbxbp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_igNzf5uBNCljB4JzCLkx-w_C4VqF-p5';
    let sb = null;

    try {
      if (window.supabase) {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch(e) {
      console.warn(e);
    }

    let products = JSON.parse(localStorage.getItem('my_products') || '[]');
    let cart = [];
    let activeCat = 'Semua';
    let currentProd = null;
    let selectedPackageIdx = 0;
    let isAdmin = false;

    document.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      renderCategories();
      renderProductCards();
      
      // Ambil data dari Supabase jika ada
      if (sb) {
        try {
          const { data } = await sb.from('products').select('*').order('created_at', { ascending: false });
          if (data && data.length > 0) {
            products = data;
            localStorage.setItem('my_products', JSON.stringify(products));
            renderCategories();
            renderProductCards();
          }
        } catch(err) {
          console.warn(err);
        }
      }
    });

    // Handle Admin Switch (Prompt langsung tanpa modal yang rentan macet)
    function handleAdminClick() {
      if (isAdmin) {
        showStoreView();
        return;
      }
      const pin = prompt('Masukkan PIN Admin:');
      if (pin === '26062026') {
        isAdmin = true;
        showAdminView();
      } else if (pin !== null) {
        alert('PIN salah!');
      }
    }

    function showAdminView() {
      document.getElementById('store-section').classList.add('hidden');
      document.getElementById('admin-section').classList.remove('hidden');
      document.getElementById('admin-switch-btn').textContent = 'Lihat Toko';
      document.getElementById('cart-btn').classList.add('hidden');
      renderAdminTable();
      lucide.createIcons();
    }

    function showStoreView() {
      document.getElementById('admin-section').classList.add('hidden');
      document.getElementById('store-section').classList.remove('hidden');
      document.getElementById('admin-switch-btn').textContent = 'Mode Admin';
      document.getElementById('cart-btn').classList.remove('hidden');
      renderProductCards();
      lucide.createIcons();
    }

    function renderCategories() {
      const cats = ['Semua', ...new Set(products.map(p => p.category).filter(Boolean))];
      const container = document.getElementById('category-chips');
      container.innerHTML = cats.map(c => `
        <button 
          type="button" 
          onclick="filterCategory('${c}')"
          class="px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border ${
            c === activeCat ? 'bg-[#D9574F] text-white border-[#D9574F]' : 'bg-white text-stone-600 border-[#E9899F]/30'
          }"
        >${c === 'Semua' ? '🍓 ' : ''}${c}</button>
      `).join('');
    }

    function filterCategory(cat) {
      activeCat = cat;
      renderCategories();
      renderProductCards();
    }

    function renderProductCards() {
      const grid = document.getElementById('product-list');
      const search = document.getElementById('search-box').value.toLowerCase().trim();

      const filtered = products.filter(p => {
        const matchCat = activeCat === 'Semua' || p.category === activeCat;
        const matchSearch = p.name.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-10 text-center text-xs text-stone-400">Belum ada produk. Tambah lewat Mode Admin ya! 🍓</div>';
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const minPrice = (p.packages && p.packages.length > 0) ? Math.min(...p.packages.map(x => x.price)) : 0;
        return `
          <div class="bg-white rounded-3xl border-2 border-[#E9899F]/30 p-3.5 flex flex-col justify-between retro-shadow">
            <div>
              <div class="w-full aspect-square bg-[#F8EBD8]/60 rounded-2xl flex items-center justify-center text-4xl mb-2">
                ${p.icon || '🍓'}
              </div>
              <span class="text-[10px] text-[#8FA477] font-bold block">${p.category}</span>
              <h4 class="font-bold text-xs line-clamp-1 mb-1">${p.name}</h4>
              <p class="text-[10px] text-stone-500 line-clamp-2">${p.description || ''}</p>
            </div>
            <div class="pt-2 border-t mt-2">
              <span class="text-[10px] text-stone-400 block">Mulai dari</span>
              <span class="font-brand font-bold text-[#D9574F] text-xs">Rp ${minPrice.toLocaleString('id-ID')}</span>
              <button type="button" onclick="openDetail('${p.id || p.name}')" class="w-full mt-2 py-1.5 rounded-xl bg-[#D9574F] text-white text-[11px] font-bold">
                Pilih Paket 🍓
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openDetail(idOrName) {
      currentProd = products.find(p => (p.id && p.id === idOrName) || p.name === idOrName);
      if (!currentProd) return;
      selectedPackageIdx = 0;

      document.getElementById('modal-title').textContent = currentProd.name;
      document.getElementById('modal-desc').textContent = currentProd.description || '';

      const pkgContainer = document.getElementById('modal-packages');
      pkgContainer.innerHTML = (currentProd.packages || []).map((pkg, idx) => `
        <div onclick="selectedPackageIdx = ${idx}; openDetail('${currentProd.id || currentProd.name}')" class="p-2.5 rounded-xl border flex justify-between items-center cursor-pointer ${idx === selectedPackageIdx ? 'border-[#D9574F] bg-[#F8EBD8]' : 'border-stone-200'}">
          <span class="text-xs font-bold">${pkg.name}</span>
          <span class="text-xs font-bold text-[#D9574F]">Rp ${pkg.price.toLocaleString('id-ID')}</span>
        </div>
      `).join('');

      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    function addSelectedToCart() {
      if (!currentProd || !currentProd.packages) return;
      const pkg = currentProd.packages[selectedPackageIdx];
      cart.push({
        productName: currentProd.name,
        packageName: pkg.name,
        price: pkg.price
      });
      closeDetailModal();
      updateCart();
      openCart();
    }

    function updateCart() {
      const badge = document.getElementById('cart-badge');
      if (cart.length > 0) {
        badge.textContent = cart.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function openCart() {
      const container = document.getElementById('cart-list');
      let total = 0;
      container.innerHTML = cart.map((it, idx) => {
        total += it.price;
        return `
          <div class="flex justify-between items-center p-2 bg-[#F8EBD8]/50 rounded-xl text-xs">
            <div>
              <div class="font-bold">${it.productName}</div>
              <div class="text-[10px] text-stone-500">${it.packageName} - Rp ${it.price.toLocaleString('id-ID')}</div>
            </div>
            <button onclick="cart.splice(${idx}, 1); updateCart(); openCart();" class="text-red-500 font-bold p-1">✕</button>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total-text').textContent = `Rp ${total.toLocaleString('id-ID')}`;
      document.getElementById('cart-modal').classList.remove('hidden');
    }

    function closeCart() {
      document.getElementById('cart-modal').classList.add('hidden');
    }

    function sendOrderWhatsApp() {
      const name = document.getElementById('cust-name').value.trim();
      const wa = document.getElementById('cust-wa').value.trim();

      if (!name || !wa) {
        alert('Mohon isi nama dan nomor WhatsApp kamu ya! 🍓');
        return;
      }

      let total = 0;
      let text = `🍓 *ORDER BARU: LITTLE DIGITAL SHOP* 🍓\n`;
      text += `Nama: ${name}\nWA: ${wa}\n━━━━━━━━━━━━━━━━\n`;
      cart.forEach((it, i) => {
        total += it.price;
        text += `${i + 1}. ${it.productName} (${it.packageName}) - Rp ${it.price.toLocaleString('id-ID')}\n`;
      });
      text += `━━━━━━━━━━━━━━━━\nTotal: Rp ${total.toLocaleString('id-ID')}\nMetode Bayar: QRIS / BCA\n\nHalo Admin, saya mau bayar pesanan ini ya! 🍓`;

      cart = [];
      updateCart();
      closeCart();
      window.open(`https://wa.me/6285163672392?text=${encodeURIComponent(text)}`, '_blank');
    }

    // Admin Functions
    function renderAdminTable() {
      const tbody = document.getElementById('admin-table-body');
      tbody.innerHTML = products.map((p, idx) => `
        <tr>
          <td class="p-2.5 font-bold">${p.icon || '🍓'} ${p.name}</td>
          <td class="p-2.5">${p.category}</td>
          <td class="p-2.5">${(p.packages || []).length} Paket</td>
          <td class="p-2.5 text-right">
            <button onclick="removeProduct(${idx}, '${p.id}')" class="text-red-500 font-bold">Hapus</button>
          </td>
        </tr>
      `).join('');
    }

    async function removeProduct(idx, id) {
      if (confirm('Hapus produk ini?')) {
        if (sb && id && id !== 'undefined') {
          await sb.from('products').delete().eq('id', id);
        }
        products.splice(idx, 1);
        localStorage.setItem('my_products', JSON.stringify(products));
        renderAdminTable();
        renderCategories();
      }
    }

    function openImportPopup() {
      document.getElementById('import-popup').classList.remove('hidden');
    }

    function closeImportPopup() {
      document.getElementById('import-popup').classList.add('hidden');
    }

    async function executeImport() {
      const txt = document.getElementById('import-input').value.trim();
      if (!txt) return;

      try {
        const parsed = JSON.parse(txt);
        const list = Array.isArray(parsed) ? parsed : [parsed];

        for (const item of list) {
          const payload = {
            name: item.name,
            category: item.category,
            icon: item.icon || '🍓',
            description: item.description || '',
            packages: item.packages || []
          };

          if (sb) {
            await sb.from('products').insert([payload]);
          }
          products.unshift(payload);
        }

        localStorage.setItem('my_products', JSON.stringify(products));
        closeImportPopup();
        renderAdminTable();
        renderCategories();
        renderProductCards();
        alert('Produk berhasil diimpor! 🍓');
      } catch (e) {
        alert('Format JSON salah. Pastikan formatnya sudah benar!');
      }
    }

    async function openNewProductPopup() {
      const name = prompt('Nama Produk:');
      if (!name) return;
      const cat = prompt('Kategori (cth: Streaming & TV):', 'Streaming & TV');
      const price = prompt('Harga Paket Standar (cth: 25000):', '25000');

      const newProd = {
        name: name,
        category: cat || 'Umum',
        icon: '🍓',
        packages: [{ name: 'Standar 1 Bulan', price: parseInt(price) || 20000 }]
      };

      if (sb) {
        await sb.from('products').insert([newProd]);
      }
      products.unshift(newProd);
      localStorage.setItem('my_products', JSON.stringify(products));
      renderAdminTable();
      renderCategories();
      renderProductCards();
    }
  </script>
</body>
</html>
